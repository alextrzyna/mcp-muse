[package]
name = "mcp-muse"
version = "2026.9.2"
edition = "2024"
authors = ["Alex Trzyna"]
description = "MCP server providing authentic 16-bit SNES gaming sounds, R2D2 expressive emotions, and professional music synthesis for AI agents"
license = "MIT"
repository = "https://github.com/alextrzyna/mcp-muse"
homepage = "https://github.com/alextrzyna/mcp-muse"
documentation = "https://github.com/alextrzyna/mcp-muse#readme"
readme = "README.md"
keywords = ["mcp", "audio", "midi", "synthesizer", "music"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.21.1"
oxisynth = "0.1"
dirs = "6.0.0"
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "7"
rand = "0.10"
sha2 = "0.10"

[dev-dependencies]
midly = "0.5"
