name: Release

# Runs for a manually pushed tag, or when the auto-tag workflow dispatches it.
# The auto-tag workflow has to dispatch explicitly: a tag it pushes with the
# workflow's GITHUB_TOKEN never fires this workflow's push trigger.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v2026.9.9)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # The tag being released, whichever way the workflow was started.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build Release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mcp-muse-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: mcp-muse-windows-x86_64.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            name: mcp-muse-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: mcp-muse-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Steps in this workflow are inlined rather than calling .github/scripts:
      # the job checks out the release tag, which may predate scripts on the
      # ref the workflow itself runs from (e.g. a re-release dispatched from main).
      - name: Set crate version from the tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Tag '$RELEASE_TAG' is not a CalVer release tag (vYYYY.M.PATCH)" >&2
            exit 1
          fi
          sed "s/^version = \".*\"/version = \"$version\"/" Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          grep -q "^version = \"$version\"" Cargo.toml
          echo "Cargo.toml version set to $version"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's Google Chrome apt source intermittently fails its hash
          # check and makes apt-get update exit 100; nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -o Acquire::Retries=3 || echo "::warning::apt-get update reported errors; installing with the indexes that were fetched"
          sudo apt-get install -y libasound2-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.name }} mcp-muse
          cd -

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }} mcp-muse.exe
          cd -

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            mcp-muse-linux-x86_64.tar.gz/mcp-muse-linux-x86_64.tar.gz
            mcp-muse-windows-x86_64.zip/mcp-muse-windows-x86_64.zip
            mcp-muse-macos-x86_64.tar.gz/mcp-muse-macos-x86_64.tar.gz
            mcp-muse-macos-aarch64.tar.gz/mcp-muse-macos-aarch64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "MCP-Muse ${{ env.RELEASE_TAG }}"
          body: |
            ## 🎮 MCP-Muse Release ${{ env.RELEASE_TAG }}

            ### Installation Options

            **Via Cargo:**
            ```bash
            cargo install mcp-muse
            ```

            **Via Binary Download:**
            Download the appropriate binary for your platform below.

            ### What's Changed

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(inputs.tag || github.ref_name, 'v')
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set crate version from the tag
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Tag '$RELEASE_TAG' is not a CalVer release tag (vYYYY.M.PATCH)" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          grep -q "^version = \"$version\"" Cargo.toml
          echo "Cargo.toml version set to $version"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -o Acquire::Retries=3 || echo "::warning::apt-get update reported errors; installing with the indexes that were fetched"
          sudo apt-get install -y libasound2-dev

      # Not continue-on-error: a failed publish must show as a failed job.
      # The GitHub release is created by a separate job and is unaffected.
      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}